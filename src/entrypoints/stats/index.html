<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statistiques · Kyara Plus</title>
    <link rel="icon" href="/icon/32.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Statistiques</h1>
      <div class="actions">
        <button type="button" id="friends">Importer mes amis</button>
        <button type="button" id="refresh" class="primary">Actualiser</button>
      </div>
    </header>
    <p id="status" role="status"></p>

    <form id="search-form" class="search" autocomplete="off">
      <input
        id="query"
        type="search"
        placeholder="Chercher un joueur par pseudo…"
        spellcheck="false"
      />
      <button type="submit">Chercher</button>
    </form>
    <div id="results"></div>

    <section id="profile" hidden></section>
    <section id="summary" class="cards"></section>
    <section id="board"></section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
